[project]
name = "pybeach-badge-creator"
version = "0.2.0"
description = "Printable PDF badge generator for the PyBeach conference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "reportlab>=4.0.0",
    "svglib>=1.5.0",
]

[tool.uv]
package = false


# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
extend-include = ["*.ipynb"]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable:
#  Pyflakes (`F`): https://docs.astral.sh/ruff/rules/#pyflakes-f
#  pycodestyle (`E`, `W`): https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
#  isort (`I`) import sorting: https://docs.astral.sh/ruff/rules/#isort-i
#  flake8-bandit (`S`) security checks: https://docs.astral.sh/ruff/rules/#flake8-bandit-s
select = ["E", "W", "F", "I", "S"]

[tool.ruff.lint.isort]
# https://docs.astral.sh/ruff/settings/#lintisort
force-single-line = true
case-sensitive = false
lines-after-imports = 2

# Ignore `F405` (import *) in config files
[tool.ruff.lint.per-file-ignores]
# Ignore line-too-long. Using ruff for formatting
"*" = ["E501"]
# Ignore security checks in tests
"**/tests.py" = ["S"]
"**/tests/*.py" = ["S"]
"**/test_*.py" = ["S"]
"*.ipynb" = ["E402", "F821", "S"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]
